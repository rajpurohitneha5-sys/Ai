name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: cp main.dart /tmp/main.dart
      - run: cp pubspec.yaml /tmp/pubspec.yaml
      - run: cp logo.png /tmp/logo.png || echo "no logo"
      - run: flutter create . --project-name ai --org com.aisuper.app --platforms android --overwrite
      - run: cp /tmp/main.dart lib/main.dart
      - run: cp /tmp/pubspec.yaml pubspec.yaml
      - run: cp /tmp/logo.png logo.png || echo "no logo"
      - run: flutter pub get
      - run: flutter pub run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
